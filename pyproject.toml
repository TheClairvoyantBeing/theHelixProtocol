[tool.poetry]
name = "helix"
version = "0.1.0"
description = "HELIX - Personal Intelligence OS"
authors = ["HELIX Dev <dev@helixos.app>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
sqlalchemy = "^2.0.29"
aiosqlite = "^0.20.0"
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
pymitt = "*"
httpx = "^0.27.0"
python-magic = "^0.4.27"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"
pytest-cov = "^5.0.0"
ruff = "^0.3.5"
mypy = "^1.9.0"
pyinstaller = "^6.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
