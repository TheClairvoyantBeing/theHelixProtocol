[tool.poetry]
name = "helix"
version = "0.1.0"
description = "HELIX - Personal Intelligence OS"
authors = ["HELIX Dev <dev@helixos.app>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
sqlalchemy = "^2.0.29"
aiosqlite = "^0.20.0"
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
cryptography = "^44.0.0"
httpx = "^0.27.0"
python-magic-bin = "^0.4.14"
python-multipart = "^0.0.9"
pillow = "^12.2.0"
piexif = "^1.1.3"
pdfplumber = "^0.11.9"
chromadb = "^1.5.8"
aiofiles = "^25.1.0"
python-docx = "^1.2.0"
openpyxl = "^3.1.5"
python-pptx = "^1.0.2"
ffmpeg-python = "^0.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"
pytest-cov = "^5.0.0"
ruff = "^0.3.5"
mypy = "^1.9.0"
pyinstaller = "^6.20.0"
types-aiofiles = "^25.1.0.20260409"
types-openpyxl = "^3.1.5.20260408"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
