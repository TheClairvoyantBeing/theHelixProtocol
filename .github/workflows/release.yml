name: Build and Release Executables

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            executable_name: helix
            asset_name: helix-linux
            path_sep: ":"
          - os: windows-latest
            executable_name: helix.exe
            asset_name: helix-windows.exe
            path_sep: ";"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Build executable
        run: >
          poetry run pyinstaller --onefile --name ${{ matrix.executable_name }} --clean
          --add-data "frontend/dist${{ matrix.path_sep }}frontend/dist"
          --hidden-import="aiosqlite"
          --hidden-import="uvicorn"
          --hidden-import="fastapi"
          --hidden-import="sqlalchemy"
          --hidden-import="chromadb"
          helix/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.executable_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/helix-linux/helix
            artifacts/helix-windows.exe/helix.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
